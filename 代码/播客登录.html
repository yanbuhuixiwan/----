<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   
    <title>博客登录</title>
    <style>
        /* 正式开发不会这么做 */
        *{
            margin: 0px;
            padding: 0px;
        }
        html,body{
            height: 100%;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            background: url(img/8.webp) no-repeat 0 0/cover;
        }
        #login{
            width: 300px;
            height: 300px;
            background-color:pink;
            border-radius: 10px;
        }
        #login-title{
            line-height: 80px;
            text-align: center;
            font-size: 2em;
            color: burlywood;
        }
        #login-content{
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            height: 200px;
        }
        #login-content input{
            width: 80%;
            height: 40px;
            border: 3px solid #ccc;
            border-radius: 10px;
            text-indent: 1em;
            
        }
    </style>
</head>
<body>
    <div id="login">
        <h2 id="login-title">Login</h2>
        <form action="" id="login-content">
            <input type="text" placeholder="请输入你的姓名">
            <input type="password" name="" id=""placeholder="请输入密码">
            <input type="submit" value="登录">
        </form>
    </div>
    
</body>
</html>
